<div class="sm:m-3 flex flex-col items-center">
{% if feeds %}
    <svg aria-hidden="true" class="sr-only">
    <defs>
        <linearGradient id="shiny-gold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFF3B0" />   <!-- Top-left light gleam -->
            <stop offset="25%" stop-color="#FACC15" />  <!-- Bright gold -->
            <stop offset="53%" stop-color="#D97706" />  <!-- Deep metallic crease -->
            <stop offset="75%" stop-color="#FDE047" />  <!-- Secondary reflection -->
            <stop offset="100%" stop-color="#92400E" /> <!-- Bottom-right bronze edge -->
        </linearGradient>
    </defs>
</svg>
    {% for feed in feeds %}
    <div class=" p-2 border border-gray-200 sm:px-20 rounded-3xl m-5 bg-white shadow-md">
        <div class="flex items-center">
            <img src="{{ feed.author.profile_pic.url }}" class="size-10 m-3 rounded-full object-cover">
            <div>
                <p class="font-bold">{{ feed.author.first_name }} {{ feed.author.last_name }}</p>
                <p class="text-sm opacity-50">{{feed.date}}</p>
            </div>
        </div>
        
        <div class="sm:w-100">
            <p class="pb-2 whitespace-pre-wrap">{{feed.caption}}</p>
            {% if feed.picture %}
            <img src="{{ feed.picture.url }}" class="size-fit rounded h-fit">
            {% endif %}
        </div>
    
        <!--Reaction, Comment & Share div-->    
        <div class="grid grid-cols-3 w-fit [&>a]:m-2 [&>a]:p-2 [&>a]: [&>a]:rounded-full">
            
            <a hx-post="{% url "feeds:react" feed.id %}" hx-target="#reaction-{{feed.id}}" hx-swap="innerHTML" id="reaction-{{feed.id}}" class="flex cursor-pointer flex-col justify-center items-center">
                
                {% include "partials/reaction-button.html" %}
               
            </a>

            <a href="#" class="text-center">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 20.25c4.97 0 9-3.694 9-8.25s-4.03-8.25-9-8.25S3 7.444 3 12c0 2.104.859 4.023 2.273 5.48.432.447.74 1.04.586 1.641a4.483 4.483 0 0 1-.923 1.785A5.969 5.969 0 0 0 6 21c1.282 0 2.47-.402 3.445-1.087.81.22 1.668.337 2.555.337Z" />
                </svg>

            </a>
            <a href="#">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 1 0 0 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186 9.566-5.314m-9.566 7.5 9.566 5.314m0 0a2.25 2.25 0 1 0 3.935 2.186 2.25 2.25 0 0 0-3.935-2.186Zm0-12.814a2.25 2.25 0 1 0 3.933-2.185 2.25 2.25 0 0 0-3.933 2.185Z" />
                </svg>

            </a>
        </div>
        <div class="flex items-center">
        <input type="text" name="comment" class="border border-gray-200 m-2 p-2 rounded-3xl" placeholder="Write something...">
        <svg role="img" class="size-6" fill="none" stroke-width="1.5" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><title>Comment</title><path d="M17.187 19.181L24 4.755 0 12.386l9.196 1.963.043 4.896 2.759-2.617-2.147-2.076 7.336 4.63z"/></svg>
        </div>
            
    </div>
    
    {% endfor %}

    <p class="text-sm opacity-50">You have viewed all feeds.</P>

{% else %}
        <p class="text-sm opacity-50">No available feeds.</P>

{% endif %}


</div>
