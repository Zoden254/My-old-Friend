<div id="modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-xs">

    <form action="/login/" method="POST" class="p-10 bg-white/50 shadow-md rounded-4xl m-10 w-fit flex-col justify-center items-center">
        {% csrf_token %}
        <h1 class="text-2xl font-bold text-center p-4">Login</h1>
        
        <div class="login-form text-center [&>label]:font-bold [&>input]:bg-gray-100 [&>input]:p-2 [&>input]:rounded-2xl">
        {% if messages %}
        {% for message in messages %}
        <h2 class="bg-red-400 my-2 rounded outline-1 outline-red-600 p-2 text-red-700">{{ message }}</h2>
        {% endfor %}
        {% endif %}
        <label for="username">Username</label><br>
        <input type="text" name="username" required><br><br>

        <label for="password">Password</label><br>
        <input type="password" name="password" required><br><br>

        <a href="#" class="text-blue-500 hover:underline">forgot password</a>
            <div class="buttons mt-4">
                <button class="bg-black p-2 text-white rounded hover:bg-white hover:text-black hover:border m-3 transition-all" hx-get="/" hx-target="body" hx-push-url="true">Cancel</button>
                <button class="bg-blue-500 p-2 text-white rounded hover:bg-white hover:text-blue-500 hover:border m-3 transition-all" type="submit" >Login</button>

            </div>
        </div>
    </form>


</div>
