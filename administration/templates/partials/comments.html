<div class="m-4">
    {% for comment in comments %}
    <div class="flex items-center p-2 m-1">
        
            <img src="{{comment.commenter.profile_pic.url}}" class="size-10 rounded-full object-cover">
        <div class="flex flex-col items-start mx-3">
            <p class="font-bold">{{comment.commenter.first_name}} {{comment.commenter.last_name}}</p>
        
        <p class="">{{comment.content}}</p>
        </div>
    </div>
    {% endfor %}
</div>
